name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: austro-linux-x86_64
            binary: austro

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: austro-linux-arm64
            binary: austro
            experimental: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: austro-windows-x86_64
            binary: austro.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: austro-macos-x86_64
            binary: austro

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: austro-macos-arm64
            binary: austro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux x86_64 dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Linux ARM64 toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            pkg-config \
            libssl-dev
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version

      - name: Configure linker (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.x86_64-apple-darwin]
          rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/ld"]

          [target.aarch64-apple-darwin]
          rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/ld"]
          EOF

      - name: Build (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}
          cd dist
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\${{ matrix.binary }} dist\${{ matrix.artifact }}.exe
          cd dist
          7z a ${{ matrix.artifact }}.zip ${{ matrix.artifact }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Austro ${{ github.ref_name }}
          body: |
            ## Austro ${{ github.ref_name }}

            ### Download

            | Platform | Architecture | File |
            |---|---|---|
            | Linux | x86_64 | `austro-linux-x86_64.tar.gz` |
            | Linux | ARM64 | `austro-linux-arm64.tar.gz` |
            | Windows | x86_64 | `austro-windows-x86_64.zip` |
            | macOS | x86_64 (Intel) | `austro-macos-x86_64.tar.gz` |
            | macOS | ARM64 (Apple Silicon) | `austro-macos-arm64.tar.gz` |

            ### Austro Explorer Ecossystem
            - https://cryptoaustro.duckdns.org
            - https://marcelhaf.github.io/Austro
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: false