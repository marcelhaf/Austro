name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: austro-linux-x86_64
            binary: austro

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: austro-linux-arm64
            binary: austro
            cross: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: austro-windows-x86_64
            binary: austro.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: austro-macos-x86_64
            binary: austro

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: austro-macos-arm64
            binary: austro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.cross != true
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}
          cd dist
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\${{ matrix.binary }} dist\${{ matrix.artifact }}.exe
          cd dist
          7z a ${{ matrix.artifact }}.zip ${{ matrix.artifact }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Austro ${{ github.ref_name }}
          body: |
            ## Austro ${{ github.ref_name }}

            ### Download

            | Platform | Architecture | File |
            |---|---|---|
            | Linux | x86_64 | `austro-linux-x86_64.tar.gz` |
            | Linux | ARM64 | `austro-linux-arm64.tar.gz` |
            | Windows | x86_64 | `austro-windows-x86_64.zip` |
            | macOS | x86_64 (Intel) | `austro-macos-x86_64.tar.gz` |
            | macOS | ARM64 (Apple Silicon) | `austro-macos-arm64.tar.gz` |

            ### Explorer
            - https://cryptoaustro.duckdns.org
            - https://marcelhaf.github.io/Austro
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: false